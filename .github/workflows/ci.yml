name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Run demo and experiment smoke checks
        run: |
          PYTHONPATH=src python -m mcp_fault_harness.cli demo
          PYTHONPATH=src python scripts/demo.py
          PYTHONPATH=src python scripts/run_experiment.py --seeds 2 --out-dir /tmp/mcp-fault-smoke
